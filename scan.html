<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#121326">
  <title>Station Terminal — PDEU Among Us</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="header-left">
      <button class="btn-back" onclick="window.location.href='map.html'">← Radar</button>
      <h2 class="header-title">STATION TERMINAL</h2>
    </div>
    <div class="header-right">
      <button id="btn-daylight" class="btn-icon" onclick="toggleDaylight()" title="Contrast">☀️</button>
      <button id="btn-snd" class="btn-icon" onclick="toggleSnd()" title="Sound">🔊</button>
    </div>
  </header>

  <main class="screen-body">

    <!-- Loading State -->
    <div id="loading-card" class="card text-center" style="padding:40px 16px;">
      <div style="font-size:48px; margin-bottom:12px;">📡</div>
      <h3 class="font-display" style="color:var(--cyan); font-size:18px;">VERIFYING BEACON...</h3>
      <p style="color:var(--muted); font-size:13px; margin-top:6px;">Authenticating physical QR token with satellite network.</p>
    </div>

    <!-- Error / Order Violation Card -->
    <div id="error-card" class="card text-center hidden" style="border-color:var(--red);">
      <div style="font-size:52px; margin-bottom:12px;">⛔</div>
      <h2 id="error-title" class="font-display" style="color:var(--red); font-size:20px;">ACCESS DENIED</h2>
      <p id="error-desc" style="font-size:14px; margin:14px 0; line-height:1.45;"></p>
      <button class="btn-primary" onclick="window.location.href='map.html'">
        RETURN TO RADAR
      </button>
    </div>

    <!-- Active Puzzle Interface Card -->
    <div id="puzzle-card" class="card hidden">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <span id="badge-station-num" class="mono" style="background:var(--bg-panel-light); color:var(--cyan); padding:3px 10px; border-radius:var(--radius-pill); font-size:11px; font-weight:700;">
          STATION 1/6
        </span>
        <span id="badge-wrong-count" class="mono" style="color:var(--red); font-size:11px; font-weight:700;">
          Errors: 0
        </span>
      </div>

      <h2 id="puzzle-station-name" class="font-display" style="font-size:22px; margin-bottom:4px;">
        OSAIL Gazebo
      </h2>
      <p id="puzzle-station-clue" style="color:var(--muted); font-size:12px; margin-bottom:14px;">
        Student Activity Centre
      </p>

      <!-- Question Box -->
      <div style="background:var(--bg-panel-light); border:2px solid var(--border); border-radius:var(--radius-md); padding:14px; margin-bottom:16px;">
        <div style="font-family:var(--font-mono); font-size:10px; color:var(--yellow); margin-bottom:6px; letter-spacing:1px;">
          CRYPTOGRAPHIC TASK:
        </div>
        <p id="puzzle-question" style="font-size:15px; font-weight:600; line-height:1.45;">
          Loading question...
        </p>
      </div>

      <!-- Answer Input Form -->
      <form id="puzzle-form">
        <div class="form-group">
          <label class="form-label" for="puzzle-input">ENTER CODE / ANSWER</label>
          <input 
            type="text" 
            id="puzzle-input" 
            class="input" 
            placeholder="Type solution here..." 
            required 
            autocomplete="off"
            autocapitalize="characters"
          >
        </div>

        <button type="submit" id="btn-submit" class="btn-primary">
          SUBMIT ANSWER →
        </button>
      </form>

      <!-- Hint Accordion -->
      <div style="margin-top:14px; text-align:center;">
        <button id="btn-toggle-hint" class="btn-ghost" style="font-size:12px; padding:6px 14px;" onclick="toggleHint()">
          💡 Need a Clue?
        </button>
        <div id="hint-box" class="hidden" style="margin-top:8px; font-size:12px; color:var(--muted); background:var(--bg-panel-light); padding:10px; border-radius:var(--radius-sm); border:1px solid var(--border);">
          Hint text
        </div>
      </div>
    </div>

    <!-- Success Resolution Card -->
    <div id="success-card" class="card text-center hidden" style="border-color:var(--green-light); padding:32px 16px;">
      <div style="font-size:56px; margin-bottom:8px;">✅</div>
      <h2 class="font-display" style="color:var(--green-light); font-size:24px; margin-bottom:6px;">STATION CLEARED!</h2>
      <p id="success-desc" style="font-size:14px; color:var(--white); margin-bottom:20px;">
        Next objective unlocked on campus radar.
      </p>
      <button id="btn-next" class="btn-primary" style="background:var(--green-light); color:#000;">
        CONTINUE TO MAP →
      </button>
    </div>

  </main>

  <script type="module">
    import { firebaseService } from './js/firebase-service.js';
    import { session, displayMode, showToast, vibrate } from './js/app.js';
    import { sound } from './js/sound.js';
    import { LOCATIONS, isAnswerCorrect } from './js/config.js';
    import { sabotageEngine } from './js/sabotage-engine.js';
    import { rogueAIEngine } from './js/rogue-ai-engine.js';

    displayMode.apply();

    const user = session.requireAuth();
    if (!user) { window.location.href = "index.html"; }

    const urlParams = new URLSearchParams(window.location.search);
    const locId = urlParams.get("loc");
    const token = urlParams.get("token");

    const loadingCard = document.getElementById("loading-card");
    const errorCard = document.getElementById("error-card");
    const puzzleCard = document.getElementById("puzzle-card");
    const successCard = document.getElementById("success-card");

    let currentTeam = null;
    let targetLocation = null;
    let isDecoyActive = false;
    let wrongAttemptsCount = 0;

    async function initScan() {
      if (!locId || !token) {
        showError("Invalid QR Beacon", "No station or token found in QR code. Scan the official station QR.");
        return;
      }

      const allLocs = await firebaseService.getLocations();
      targetLocation = allLocs.find(l => l.id === locId);

      if (!targetLocation) {
        showError("Unknown Station", `Station '${locId}' is not registered on this campus.`);
        return;
      }

      currentTeam = await firebaseService.getTeam(user.teamId);
      if (!currentTeam) {
        showError("Crew Not Found", "Could not locate your crew record. Please re-enter room code.");
        return;
      }

      // Token check
      if (String(targetLocation.token).trim().toUpperCase() !== String(token).trim().toUpperCase()) {
        showError("Invalid Token", "Security verification failed for this station. Ensure you scan the authentic QR.");
        return;
      }

      // Sequence check
      const currentIdx = currentTeam.currentLocationIndex || 1;

      if (targetLocation.order < currentIdx) {
        showError("Already Cleared", `Your crew has already completed '${targetLocation.name}'. Head to your next objective on the radar.`);
        return;
      }

      if (targetLocation.order > currentIdx) {
        const req = allLocs.find(l => l.order === currentIdx);
        showError(
          "Sequence Violation",
          `Access Denied! You are skipping ahead. Your crew must first visit: <strong>${req ? req.name : 'Station ' + currentIdx}</strong>.`
        );
        return;
      }

      // Initialize engines
      sabotageEngine.init(currentTeam, user);
      rogueAIEngine.init(currentTeam, user);

      // Subscribe for live puzzle swap / glitch
      firebaseService.subscribeTeam(user.teamId, (updated) => {
        if (!updated) return;
        currentTeam = updated;
        sabotageEngine.handleTeamUpdate(updated);
        rogueAIEngine.handleTeamUpdate(updated);
        renderPuzzleState();
      });

      renderPuzzleState();
    }

    function showError(title, msg) {
      loadingCard.classList.add("hidden");
      puzzleCard.classList.add("hidden");
      errorCard.classList.remove("hidden");
      document.getElementById("error-title").textContent = title;
      document.getElementById("error-desc").innerHTML = msg;
      sound.error();
      vibrate([150, 50, 150]);
    }

    function renderPuzzleState() {
      loadingCard.classList.add("hidden");
      errorCard.classList.add("hidden");
      puzzleCard.classList.remove("hidden");

      document.getElementById("badge-station-num").textContent = `STATION ${targetLocation.order}/${LOCATIONS.length}`;
      document.getElementById("puzzle-station-name").textContent = targetLocation.name;
      document.getElementById("puzzle-station-clue").textContent = targetLocation.clue || "";

      const locProgress = currentTeam.progress?.[targetLocation.id] || {};
      wrongAttemptsCount = locProgress.wrongAttempts || 0;
      document.getElementById("badge-wrong-count").textContent = `Errors: ${wrongAttemptsCount}`;

      // Check Puzzle Swap sabotage
      const now = Date.now();
      const pSwap = currentTeam.sabotageState?.puzzleSwap;
      isDecoyActive = pSwap?.active && pSwap.expiresAt > now;

      const qText = document.getElementById("puzzle-question");
      const hText = document.getElementById("hint-box");

      if (isDecoyActive) {
        qText.textContent = targetLocation.decoyPuzzle?.question || "Enter master hex clearance code:";
        hText.textContent = targetLocation.decoyPuzzle?.hint || "Inspect surrounding physical structures.";
      } else {
        qText.textContent = targetLocation.puzzle?.question || "Solve station riddle.";
        hText.textContent = targetLocation.puzzle?.hint || "Look closely at the surrounding area.";
      }
    }

    window.toggleHint = () => {
      sound.click();
      const hb = document.getElementById("hint-box");
      hb.classList.toggle("hidden");
    };

    window.toggleDaylight = () => { displayMode.toggle(); };
    window.toggleSnd = () => {
      const m = sound.toggleMute();
      document.getElementById("btn-snd").textContent = m ? "🔇" : "🔊";
    };
    if (sound.getMuted()) document.getElementById("btn-snd").textContent = "🔇";

    // Answer submit
    document.getElementById("puzzle-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      sound.click();

      const input = document.getElementById("puzzle-input");
      const submitBtn = document.getElementById("btn-submit");
      const answer = input.value.trim();
      if (!answer) return;

      submitBtn.disabled = true;
      submitBtn.textContent = "VERIFYING...";

      // 1. Decoy rejection
      if (isDecoyActive) {
        await handleWrong("INCORRECT SOLUTION: Verification checksum failed.");
        submitBtn.disabled = false;
        submitBtn.textContent = "SUBMIT ANSWER →";
        return;
      }

      // 2. Check correctness
      const isCorrect = isAnswerCorrect(answer, targetLocation.puzzle?.answer);

      // 3. Fake Reject trap
      const fakeReject = currentTeam.sabotageState?.fakeReject;
      if (isCorrect && fakeReject?.active) {
        await firebaseService.updateTeam(user.teamId, { "sabotageState.fakeReject.active": false });
        await firebaseService.logSabotage(user.teamId, {
          type: "fakeReject_consumed",
          playerId: user.playerId,
          locationId: targetLocation.id
        });
        await handleWrong("ACCESS DENIED: Signal packet corrupted. Verification rejected.");
        submitBtn.disabled = false;
        submitBtn.textContent = "SUBMIT ANSWER →";
        return;
      }

      if (isCorrect) {
        await handleSuccess();
      } else {
        await handleWrong("INCORRECT: Double-check your clues and try again!");
        submitBtn.disabled = false;
        submitBtn.textContent = "SUBMIT ANSWER →";
      }
    });

    async function handleWrong(msg) {
      wrongAttemptsCount++;
      sound.error();
      vibrate([100, 50, 100]);

      const input = document.getElementById("puzzle-input");
      input.style.borderColor = "var(--red)";
      setTimeout(() => input.style.borderColor = "", 500);

      showToast(msg, "error");

      const updateKey = `progress.${targetLocation.id}.wrongAttempts`;
      try {
        await firebaseService.updateTeam(user.teamId, { [updateKey]: wrongAttemptsCount });
      } catch (e) {}
    }

    async function handleSuccess() {
      sound.success();
      vibrate([50, 30, 80, 40, 120]);

      const nextIdx = targetLocation.order + 1;
      const isFinal = targetLocation.order >= LOCATIONS.length;

      const updates = {
        currentLocationIndex: nextIdx,
        [`progress.${targetLocation.id}`]: {
          status: "completed",
          timestamp: Date.now(),
          wrongAttempts: wrongAttemptsCount
        }
      };

      if (isFinal) updates.finishTime = Date.now();

      try {
        await firebaseService.updateTeam(user.teamId, updates);
      } catch (e) {}

      puzzleCard.classList.add("hidden");
      successCard.classList.remove("hidden");

      const desc = document.getElementById("success-desc");
      const nextBtn = document.getElementById("btn-next");

      if (isFinal) {
        desc.innerHTML = "🎉 All 6 PDEU Campus Stations Cleared!<br>Proceeding to Mission Debrief & Voting.";
        nextBtn.textContent = "FINAL DEBRIEF →";
        nextBtn.onclick = () => window.location.href = "finish.html";
      } else {
        const nextLoc = LOCATIONS.find(l => l.order === nextIdx);
        desc.innerHTML = `Beacon decoded! Radar pointing to: <strong>${nextLoc ? nextLoc.name : 'Station ' + nextIdx}</strong>.`;
        nextBtn.textContent = "CONTINUE TO MAP →";
        nextBtn.onclick = () => window.location.href = "map.html";
      }
    }

    initScan();
  </script>
</body>
</html>
