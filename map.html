<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#121326">
  <title>Campus Radar — PDEU Among Us</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/map.css">
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <!-- Bundled pure JS QR Code scanner engine -->
  <script src="js/vendor/jsqr.js"></script>
</head>
<body class="map-page-body">

  <!-- Mobile Header (Navigation Bar) -->
  <header class="app-header">
    <div class="header-left">
      <span class="header-icon">📡</span>
      <div>
        <div class="header-title" style="font-size:14px;">PDEU RADAR</div>
        <div id="player-tag" class="header-sub">Connecting...</div>
      </div>
    </div>
    <div class="header-right">
      <button id="btn-recenter" class="btn-icon" onclick="recenterMap()" title="Recenter Campus Map">⟲</button>
      <button id="btn-daylight" class="btn-icon" onclick="toggleDaylight()" title="Contrast">☀️</button>
      <button id="btn-snd" class="btn-icon" onclick="toggleSnd()" title="Sound">🔊</button>
    </div>
  </header>

  <!-- Task Progress Bar -->
  <div class="progress-bar-strip">
    <span class="progress-label">TASKS:</span>
    <div class="progress-track">
      <div id="progress-fill" class="progress-fill"></div>
    </div>
    <span id="progress-text" class="progress-count">0/6</span>
  </div>

  <!-- Map Viewport -->
  <div id="map-container">
    <!-- Floating HUD Card (Docked INSIDE Map Viewport to avoid covering top navbar) -->
    <div class="map-hud" id="hud">
      <div class="hud-top">
        <div class="hud-top-left">
          <span id="hud-dot" class="hud-dot"></span>
          <span id="hud-label" class="hud-label">TARGET SECTOR 1 OF 6</span>
        </div>
        <button id="hud-toggle-btn" class="hud-collapse-btn" onclick="toggleHudCollapse(event)" title="Minimize or Expand">▲</button>
      </div>
      <div class="hud-content" id="hud-content">
        <div id="hud-name" class="hud-name">TARGET: SECTOR 1</div>
        <div id="hud-clue" class="hud-clue">Initializing campus radar beacon...</div>
      </div>
    </div>
  </div>

  <!-- Floating Scan QR Button (Bottom Center) -->
  <button class="fab-scan" id="btn-scan-qr" onclick="openScanner()">
    <span style="font-size:22px;">📷</span>
    <span>SCAN QR</span>
  </button>

  <!-- IN-WEBSITE LIVE CAMERA QR SCANNER OVERLAY -->
  <div id="scanner-view" class="scanner-overlay hidden">
    <!-- Top Bar with Close and Torch -->
    <div class="scanner-top-bar">
      <span style="font-family:var(--font-display); font-size:14px; color:var(--cyan);">SCAN STATION QR</span>
      <div style="display:flex; gap:8px;">
        <button id="btn-toggle-torch" class="btn-icon hidden" onclick="toggleTorch()" style="background:rgba(0,0,0,0.6);">⚡</button>
        <button class="btn-icon" onclick="closeScanner()" style="background:rgba(0,0,0,0.6);">✕</button>
      </div>
    </div>

    <!-- Live Video Stream -->
    <video id="scanner-video" class="scanner-video-feed" playsinline autoplay muted></video>
    <canvas id="scanner-canvas" style="display:none;"></canvas>

    <!-- Sci-fi Visor Scanner Frame -->
    <div class="scanner-frame-box">
      <div class="scanner-corner scanner-tl"></div>
      <div class="scanner-corner scanner-tr"></div>
      <div class="scanner-corner scanner-bl"></div>
      <div class="scanner-corner scanner-br"></div>
      <div class="scanner-laser"></div>
    </div>

    <div class="scanner-bottom-hint">
      Point camera at physical Station QR code
      <div style="margin-top:8px;">
        <button onclick="promptManualToken()" style="background:rgba(22,24,46,0.9); border:1px solid var(--border); color:var(--cyan); font-family:var(--font-display); font-size:11px; padding:6px 14px; border-radius:14px; cursor:pointer;">
          ⌨ Manual Code Entry
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import { firebaseService } from './js/firebase-service.js';
    import { session, displayMode, showToast, vibrate } from './js/app.js';
    import { sound } from './js/sound.js';
    import { LOCATIONS } from './js/config.js';
    import { CampusMapEngine } from './js/map-engine.js';
    import { sabotageEngine } from './js/sabotage-engine.js';
    import { rogueAIEngine } from './js/rogue-ai-engine.js';

    displayMode.apply();

    const user = session.requireAuth();
    if (!user) { window.location.href = "index.html"; }

    // Display Player Tag with Color
    const roleIcon = user.role === 'impostor' ? '😈' : user.role === 'survivor' ? '⚡' : '🧑‍🚀';
    document.getElementById('player-tag').innerHTML = `
      <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:${user.color || '#38fedc'}; margin-right:4px;"></span>
      ${user.teamId} · ${user.playerName} ${roleIcon}
    `;

    // Initialize Map Engine (init with empty locations list until team data arrives)
    const mapEngine = new CampusMapEngine(document.getElementById('map-container'), {
      locations: []
    });

    let currentTeamData = null;

    // Recenter Map view handler
    window.recenterMap = () => {
      sound.click();
      vibrate([40]);
      mapEngine.resetView();
      showToast("Campus Map Centered", "info");
    };

    // HUD Collapse / Expand toggle
    window.toggleHudCollapse = (e) => {
      e?.stopPropagation();
      sound.click();
      const hud = document.getElementById('hud');
      const btn = document.getElementById('hud-toggle-btn');
      hud.classList.toggle('is-collapsed');
      const isCollapsed = hud.classList.contains('is-collapsed');
      btn.textContent = isCollapsed ? '▼' : '▲';
    };

    // Unified Team State Handler
    function applyTeamState(team) {
      if (!team) return;
      currentTeamData = team;

      sabotageEngine.init(team, user);
      sabotageEngine.handleTeamUpdate(team);
      rogueAIEngine.init(team, user);
      rogueAIEngine.handleTeamUpdate(team);

      const idx = team.currentLocationIndex || 1;
      // Resolve team's personalized location order (fallback: original config order)
      const locationOrder = team.locationOrder || LOCATIONS.slice().sort((a,b) => a.order - b.order).map(l => l.id);

      // Redirect to finish if all stations completed
      if (idx > locationOrder.length || team.finishTime) {
        window.location.href = "finish.html";
        return;
      }

      // Progress bar
      const done = idx - 1;
      document.getElementById('progress-fill').style.width = `${Math.round((done / locationOrder.length) * 100)}%`;
      document.getElementById('progress-text').textContent = `${done}/${locationOrder.length}`;

      // Resolve active location from the team's ordered array
      const activeLocId = locationOrder[idx - 1];
      const activeLoc = LOCATIONS.find(l => l.id === activeLocId) || LOCATIONS[0];

      // Sabotage Map Scramble check
      const scr = team.sabotageState?.mapScramble;
      const isScrambled = scr?.active && scr?.expiresAt > Date.now();

      // Update Map Visuals (Hides future locked stations, glows active station)
      // Build an ordered list for the map engine where order 1..N matches this team's randomized route
      const orderedLocs = locationOrder.map((id, index) => {
        const found = LOCATIONS.find(l => l.id === id);
        return found ? { ...found, order: index + 1 } : null;
      }).filter(Boolean);

      mapEngine.updateState({
        currentIndex: idx,
        scrambleState: isScrambled ? scr : null,
        locations: orderedLocs
      });

      // Update HUD Info
      const dot = document.getElementById('hud-dot');
      const label = document.getElementById('hud-label');
      const name = document.getElementById('hud-name');
      const clue = document.getElementById('hud-clue');

      if (isScrambled) {
        const fake = LOCATIONS.find(l => l.id === scr.fakeLocationId) || LOCATIONS[0];
        label.textContent = '⚠ RADAR SCRAMBLED';
        label.style.color = '#ef7d0e';
        dot.style.background = '#ef7d0e';
        dot.style.boxShadow = '0 0 10px #ef7d0e';
        name.textContent = `TARGET: SECTOR ${idx}`;
        clue.textContent = fake.clue || 'Interference detected! Follow the beacon signal on your radar.';
      } else {
        label.textContent = `ACTIVE OBJECTIVE — ${idx} OF ${locationOrder.length}`;
        label.style.color = 'var(--cyan)';
        dot.style.background = 'var(--cyan)';
        dot.style.boxShadow = '0 0 10px var(--cyan)';
        name.textContent = `TARGET: SECTOR ${idx}`;
        clue.textContent = activeLoc.clue;
      }
    }

    // 1. Immediate instant fetch on page load (eliminates WebSocket connection delay)
    firebaseService.getTeam(user.teamId).then(applyTeamState).catch(console.warn);

    // 2. Real-Time WebSocket Firestore Subscription
    let unsub = firebaseService.subscribeTeam(user.teamId, applyTeamState);

    // 3. High-speed 2s Polling Backup (ensures instant state even if phone screen turns off/on)
    let mapPollTimer = setInterval(async () => {
      try {
        const team = await firebaseService.getTeam(user.teamId);
        if (team) applyTeamState(team);
      } catch (e) {}
    }, 2000);

    // Controls
    window.toggleDaylight = () => { displayMode.toggle(); };
    window.toggleSnd = () => {
      const m = sound.toggleMute();
      document.getElementById("btn-snd").textContent = m ? "🔇" : "🔊";
    };
    if (sound.getMuted()) document.getElementById("btn-snd").textContent = "🔇";

    // ==========================================
    // LIVE IN-WEBSITE CAMERA QR SCANNER ENGINE
    // ==========================================
    let cameraStream = null;
    let scanAnimationId = null;
    let videoTrack = null;
    let nativeDetector = null;

    if ('BarcodeDetector' in window) {
      try {
        nativeDetector = new BarcodeDetector({ formats: ['qr_code'] });
      } catch (e) {
        nativeDetector = null;
      }
    }

    const scannerView = document.getElementById('scanner-view');
    const video = document.getElementById('scanner-video');
    const canvas = document.getElementById('scanner-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    window.openScanner = async () => {
      sound.click();
      vibrate([40]);

      try {
        scannerView.classList.remove('hidden');

        // Request environment (back-facing) camera
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = cameraStream;
        await video.play();

        // Check torch support
        videoTrack = cameraStream.getVideoTracks()[0];
        const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
        if (caps.torch) {
          document.getElementById('btn-toggle-torch').classList.remove('hidden');
        }

        // Start scanning frames
        startScanningLoop();
      } catch (err) {
        console.error("Camera access error:", err);
        showToast("Camera error: " + (err.message || "Permission denied"), "error");
        promptManualToken();
      }
    };

    window.closeScanner = () => {
      if (scanAnimationId) cancelAnimationFrame(scanAnimationId);
      if (cameraStream) {
        cameraStream.getTracks().forEach(t => t.stop());
        cameraStream = null;
      }
      scannerView.classList.add('hidden');
    };

    let isTorchOn = false;
    window.toggleTorch = async () => {
      if (!videoTrack) return;
      try {
        isTorchOn = !isTorchOn;
        await videoTrack.applyConstraints({ advanced: [{ torch: isTorchOn }] });
      } catch (e) {}
    };

    function startScanningLoop() {
      let isProcessing = false;

      const scanFrame = async () => {
        if (!cameraStream || video.readyState !== video.HAVE_ENOUGH_DATA) {
          scanAnimationId = requestAnimationFrame(scanFrame);
          return;
        }

        // Native BarcodeDetector (Fastest on Mobile Chrome / iOS 17+)
        if (nativeDetector && !isProcessing) {
          isProcessing = true;
          try {
            const barcodes = await nativeDetector.detect(video);
            if (barcodes && barcodes.length > 0) {
              const codeValue = barcodes[0].rawValue;
              if (handleQRCodeResult(codeValue)) return;
            }
          } catch (e) {}
          isProcessing = false;
        }

        // Pure JS Fallback Engine (jsQR)
        if (window.jsQR && video.videoWidth > 0) {
          canvas.width = Math.min(640, video.videoWidth);
          canvas.height = Math.min(480, video.videoHeight);
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = window.jsQR(imgData.data, imgData.width, imgData.height, {
            inversionAttempts: "dontInvert"
          });

          if (code && code.data) {
            if (handleQRCodeResult(code.data)) return;
          }
        }

        scanAnimationId = requestAnimationFrame(scanFrame);
      };

      scanAnimationId = requestAnimationFrame(scanFrame);
    }

    function handleQRCodeResult(scannedData) {
      if (!scannedData) return false;

      if (scannedData.includes('loc=') && scannedData.includes('token=')) {
        sound.success();
        vibrate([80, 40, 140]);
        closeScanner();

        if (scannedData.startsWith('http://') || scannedData.startsWith('https://')) {
          window.location.href = scannedData;
        } else {
          const query = scannedData.includes('?') ? scannedData.split('?')[1] : scannedData;
          window.location.href = `scan.html?${query}`;
        }
        return true;
      }

      return false;
    }

    // Manual token entry fallback (ensures no participant is stuck if camera permission denied)
    window.promptManualToken = () => {
      closeScanner();
      const raw = prompt("Enter Station Token Code (found on physical Station QR):");
      if (!raw) return;
      const cleanToken = raw.trim().toUpperCase();
      const matchedLoc = LOCATIONS.find(l => l.token.toUpperCase() === cleanToken);
      if (matchedLoc) {
        window.location.href = `scan.html?loc=${matchedLoc.id}&token=${matchedLoc.token}`;
      } else {
        showToast("Invalid Station Token", "error");
      }
    };

    window.addEventListener('beforeunload', () => {
      if (unsub) unsub();
      if (mapPollTimer) clearInterval(mapPollTimer);
      closeScanner();
    });
  </script>
</body>
</html>
