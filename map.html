<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#121326">
  <title>Campus Radar — PDEU Among Us</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/map.css">
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <!-- Bundled pure JS QR Code scanner engine -->
  <script src="js/vendor/jsqr.js"></script>
</head>
<body class="map-page-body">

  <!-- Mobile Header -->
  <header class="app-header">
    <div class="header-left">
      <span class="header-icon">📡</span>
      <div>
        <div class="header-title" style="font-size:14px;">PDEU RADAR</div>
        <div id="player-tag" class="header-sub">Connecting...</div>
      </div>
    </div>
    <div class="header-right">
      <button id="btn-gps-toggle" class="btn-icon" onclick="recenterGPS()" title="My Location">📍</button>
      <button id="btn-daylight" class="btn-icon" onclick="toggleDaylight()" title="Contrast">☀️</button>
      <button id="btn-snd" class="btn-icon" onclick="toggleSnd()" title="Sound">🔊</button>
    </div>
  </header>

  <!-- Task Progress Bar -->
  <div class="progress-bar-strip">
    <span class="progress-label">TASKS:</span>
    <div class="progress-track">
      <div id="progress-fill" class="progress-fill"></div>
    </div>
    <span id="progress-text" class="progress-count">0/6</span>
  </div>

  <!-- Map Viewport -->
  <div id="map-container"></div>

  <!-- Floating HUD Card (Current Objective Only) -->
  <div class="map-hud" id="hud">
    <div class="hud-top">
      <span id="hud-dot" class="hud-dot"></span>
      <span id="hud-label" class="hud-label">TARGET STATION 1 OF 6</span>
    </div>
    <div id="hud-name" class="hud-name">OSAIL Gazebo</div>
    <div id="hud-clue" class="hud-clue">Head to the central Osail Gazebo pavilion beside the Cricket Ground.</div>
  </div>

  <!-- Floating Scan QR Button (Bottom Center) -->
  <button class="fab-scan" id="btn-scan-qr" onclick="openScanner()">
    <span style="font-size:22px;">📷</span>
    <span>SCAN QR</span>
  </button>

  <!-- IN-WEBSITE LIVE CAMERA QR SCANNER OVERLAY -->
  <div id="scanner-view" class="scanner-overlay hidden">
    <!-- Top Bar with Close and Torch -->
    <div class="scanner-top-bar">
      <span style="font-family:var(--font-display); font-size:14px; color:var(--cyan);">SCAN STATION QR</span>
      <div style="display:flex; gap:8px;">
        <button id="btn-toggle-torch" class="btn-icon hidden" onclick="toggleTorch()" style="background:rgba(0,0,0,0.6);">⚡</button>
        <button class="btn-icon" onclick="closeScanner()" style="background:rgba(0,0,0,0.6);">✕</button>
      </div>
    </div>

    <!-- Live Video Stream -->
    <video id="scanner-video" class="scanner-video-feed" playsinline autoplay muted></video>
    <canvas id="scanner-canvas" style="display:none;"></canvas>

    <!-- Sci-fi Among Us Visor Scanner Frame -->
    <div class="scanner-frame-box">
      <div class="scanner-corner scanner-tl"></div>
      <div class="scanner-corner scanner-tr"></div>
      <div class="scanner-corner scanner-bl"></div>
      <div class="scanner-corner scanner-br"></div>
      <div class="scanner-laser"></div>
    </div>

    <div class="scanner-bottom-hint">
      Point camera at physical Station QR code
    </div>
  </div>

  <script type="module">
    import { firebaseService } from './js/firebase-service.js';
    import { session, displayMode, showToast, vibrate } from './js/app.js';
    import { sound } from './js/sound.js';
    import { LOCATIONS, gpsToCampusCoords } from './js/config.js';
    import { CampusMapEngine } from './js/map-engine.js';
    import { sabotageEngine } from './js/sabotage-engine.js';
    import { rogueAIEngine } from './js/rogue-ai-engine.js';

    displayMode.apply();

    const user = session.requireAuth();
    if (!user) { window.location.href = "index.html"; }

    // Display Player Tag with Color
    const roleIcon = user.role === 'impostor' ? '😈' : user.role === 'survivor' ? '⚡' : '🧑‍🚀';
    document.getElementById('player-tag').innerHTML = `
      <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:${user.color || '#38fedc'}; margin-right:4px;"></span>
      ${user.teamId} · ${user.playerName} ${roleIcon}
    `;

    // Initialize Map Engine
    const mapEngine = new CampusMapEngine(document.getElementById('map-container'), {
      locations: LOCATIONS
    });

    let currentTeamData = null;
    let myLastKnownCoords = { x: 46.5, y: 41.0 };

    // REAL-TIME GPS TRACKING
    function startGPSTracking() {
      if (!navigator.geolocation) {
        console.warn("Geolocation not supported by device.");
        return;
      }

      navigator.geolocation.watchPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          const campusCoords = gpsToCampusCoords(lat, lng);
          myLastKnownCoords = campusCoords;

          // Broadcast to Firestore (throttled)
          firebaseService.updatePlayerLocation(user.teamId, user.playerId, {
            ...campusCoords,
            lat,
            lng
          });
        },
        (err) => {
          console.warn("GPS tracking warning:", err.message);
        },
        {
          enableHighAccuracy: true,
          maximumAge: 3000,
          timeout: 10000
        }
      );
    }
    startGPSTracking();

    window.recenterGPS = () => {
      sound.click();
      vibrate([40]);
      mapEngine.resetView();
      showToast("Centered Campus Radar", "info");
    };

    // Real-Time Firestore Team Updates
    let unsub = firebaseService.subscribeTeam(user.teamId, (team) => {
      if (!team) return;
      currentTeamData = team;

      sabotageEngine.init(team, user);
      sabotageEngine.handleTeamUpdate(team);
      rogueAIEngine.init(team, user);
      rogueAIEngine.handleTeamUpdate(team);

      const idx = team.currentLocationIndex || 1;

      // Redirect to finish if all 6 stations completed
      if (idx > LOCATIONS.length || team.finishTime) {
        window.location.href = "finish.html";
        return;
      }

      // Progress bar
      const done = idx - 1;
      document.getElementById('progress-fill').style.width = `${Math.round((done / LOCATIONS.length) * 100)}%`;
      document.getElementById('progress-text').textContent = `${done}/${LOCATIONS.length}`;

      // Sabotage Map Scramble check
      const scr = team.sabotageState?.mapScramble;
      const isScrambled = scr?.active && scr?.expiresAt > Date.now();

      // Update Map Visuals (Hides future stations, renders live colored player beans)
      mapEngine.updateState({
        currentIndex: idx,
        scrambleState: isScrambled ? scr : null,
        locations: LOCATIONS,
        players: team.players || [],
        currentUserId: user.playerId
      });

      // Update HUD Info
      const hud = document.getElementById('hud');
      const dot = document.getElementById('hud-dot');
      const label = document.getElementById('hud-label');
      const name = document.getElementById('hud-name');
      const clue = document.getElementById('hud-clue');

      if (isScrambled) {
        const fake = LOCATIONS.find(l => l.id === scr.fakeLocationId) || LOCATIONS[0];
        label.textContent = '⚠ RADAR SCRAMBLED';
        label.style.color = '#ef7d0e';
        dot.style.background = '#ef7d0e';
        name.textContent = fake.name;
        clue.textContent = 'Interference detected! Radar signal fluctuating.';
      } else {
        const loc = LOCATIONS.find(l => l.order === idx) || LOCATIONS[0];
        label.textContent = `TARGET STATION ${idx} OF ${LOCATIONS.length}`;
        label.style.color = 'var(--cyan)';
        dot.style.background = 'var(--cyan)';
        name.textContent = loc.name;
        clue.textContent = loc.clue;
      }
    });

    // Controls
    window.toggleDaylight = () => { displayMode.toggle(); };
    window.toggleSnd = () => {
      const m = sound.toggleMute();
      document.getElementById("btn-snd").textContent = m ? "🔇" : "🔊";
    };
    if (sound.getMuted()) document.getElementById("btn-snd").textContent = "🔇";

    // ==========================================
    // LIVE IN-WEBSITE CAMERA QR SCANNER ENGINE
    // ==========================================
    let cameraStream = null;
    let scanAnimationId = null;
    let videoTrack = null;
    let nativeDetector = null;

    if ('BarcodeDetector' in window) {
      try {
        nativeDetector = new BarcodeDetector({ formats: ['qr_code'] });
      } catch (e) {
        nativeDetector = null;
      }
    }

    const scannerView = document.getElementById('scanner-view');
    const video = document.getElementById('scanner-video');
    const canvas = document.getElementById('scanner-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    window.openScanner = async () => {
      sound.click();
      vibrate([40]);

      try {
        scannerView.classList.remove('hidden');

        // Request back-facing camera
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = cameraStream;
        await video.play();

        // Check torch support
        videoTrack = cameraStream.getVideoTracks()[0];
        const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
        if (caps.torch) {
          document.getElementById('btn-toggle-torch').classList.remove('hidden');
        }

        // Start scanning frames
        startScanningLoop();
      } catch (err) {
        console.error("Camera access error:", err);
        showToast("Camera error: " + (err.message || "Permission denied"), "error");
        closeScanner();
      }
    };

    window.closeScanner = () => {
      if (scanAnimationId) cancelAnimationFrame(scanAnimationId);
      if (cameraStream) {
        cameraStream.getTracks().forEach(t => t.stop());
        cameraStream = null;
      }
      scannerView.classList.add('hidden');
    };

    let isTorchOn = false;
    window.toggleTorch = async () => {
      if (!videoTrack) return;
      try {
        isTorchOn = !isTorchOn;
        await videoTrack.applyConstraints({ advanced: [{ torch: isTorchOn }] });
      } catch (e) {}
    };

    function startScanningLoop() {
      let isProcessing = false;

      const scanFrame = async () => {
        if (!cameraStream || video.readyState !== video.HAVE_ENOUGH_DATA) {
          scanAnimationId = requestAnimationFrame(scanFrame);
          return;
        }

        // Native BarcodeDetector (Fastest on Mobile Chrome / iOS 17+)
        if (nativeDetector && !isProcessing) {
          isProcessing = true;
          try {
            const barcodes = await nativeDetector.detect(video);
            if (barcodes && barcodes.length > 0) {
              const codeValue = barcodes[0].rawValue;
              if (handleQRCodeResult(codeValue)) return;
            }
          } catch (e) {}
          isProcessing = false;
        }

        // Pure JS Fallback Engine (jsQR)
        if (window.jsQR && video.videoWidth > 0) {
          canvas.width = Math.min(640, video.videoWidth);
          canvas.height = Math.min(480, video.videoHeight);
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = window.jsQR(imgData.data, imgData.width, imgData.height, {
            inversionAttempts: "dontInvert"
          });

          if (code && code.data) {
            if (handleQRCodeResult(code.data)) return;
          }
        }

        scanAnimationId = requestAnimationFrame(scanFrame);
      };

      scanAnimationId = requestAnimationFrame(scanFrame);
    }

    function handleQRCodeResult(scannedData) {
      if (!scannedData) return false;

      // Check if QR contains station parameters: loc=... and token=...
      if (scannedData.includes('loc=') && scannedData.includes('token=')) {
        sound.success();
        vibrate([80, 40, 140]);
        closeScanner();

        // If it's a full URL, navigate directly
        if (scannedData.startsWith('http://') || scannedData.startsWith('https://')) {
          window.location.href = scannedData;
        } else {
          // If relative or raw query string
          const query = scannedData.includes('?') ? scannedData.split('?')[1] : scannedData;
          window.location.href = `scan.html?${query}`;
        }
        return true;
      }

      return false;
    }

    window.addEventListener('beforeunload', () => {
      if (unsub) unsub();
      closeScanner();
    });
  </script>
</body>
</html>
