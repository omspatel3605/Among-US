<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#121326">
  <title>Campus Radar — PDEU Among Us</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/map.css">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="map-page-body">

  <!-- Compact mobile header -->
  <header class="app-header">
    <div class="header-left">
      <span class="header-icon">📡</span>
      <div>
        <div class="header-title" style="font-size:14px;">CAMPUS RADAR</div>
        <div id="player-tag" class="header-sub"></div>
      </div>
    </div>
    <div class="header-right">
      <button id="btn-daylight" class="btn-icon" onclick="toggleDaylight()" title="Contrast">☀️</button>
      <button id="btn-snd" class="btn-icon" onclick="toggleSnd()" title="Sound">🔊</button>
    </div>
  </header>

  <!-- Task Progress Bar -->
  <div class="progress-bar-strip">
    <span class="progress-label">TASKS:</span>
    <div class="progress-track">
      <div id="progress-fill" class="progress-fill"></div>
    </div>
    <span id="progress-text" class="progress-count">0/6</span>
  </div>

  <!-- Map Viewport (fills remaining space) -->
  <div id="map-container"></div>

  <!-- Floating HUD Card (Current Objective) -->
  <div class="map-hud" id="hud">
    <div class="hud-top">
      <span id="hud-dot" class="hud-dot"></span>
      <span id="hud-label" class="hud-label">STATION 1 OF 6</span>
    </div>
    <div id="hud-name" class="hud-name">Loading...</div>
    <div id="hud-clue" class="hud-clue"></div>
  </div>

  <!-- Floating Scan QR Button (Bottom Center) -->
  <button class="fab-scan" id="btn-scan-qr" onclick="openScanner()">
    <span style="font-size:24px;">📷</span>
    <span>SCAN QR</span>
  </button>

  <!-- Simple Manual URL Entry Modal -->
  <div id="scanner-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3 class="modal-title">📷 Scan Station QR</h3>
      <p class="modal-desc">Use your phone camera to scan the QR code, or paste the link below:</p>
      <input type="url" id="manual-url" class="input" placeholder="Paste scanned URL here..." autocomplete="off">
      <div class="modal-actions">
        <button class="btn-primary" onclick="submitManualUrl()">Open</button>
        <button class="btn-ghost" onclick="closeScanner()">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { firebaseService } from './js/firebase-service.js';
    import { session, displayMode, showToast, vibrate } from './js/app.js';
    import { sound } from './js/sound.js';
    import { LOCATIONS } from './js/config.js';
    import { CampusMapEngine } from './js/map-engine.js';
    import { sabotageEngine } from './js/sabotage-engine.js';
    import { rogueAIEngine } from './js/rogue-ai-engine.js';

    displayMode.apply();

    const user = session.requireAuth();
    if (!user) { window.location.href = "index.html"; }

    // Player tag
    const roleIcon = user.role === 'impostor' ? '😈' : user.role === 'survivor' ? '⚡' : '🧑‍🚀';
    document.getElementById('player-tag').textContent = `${user.teamId} · ${user.playerName} ${roleIcon}`;

    // Init map
    const mapEngine = new CampusMapEngine(document.getElementById('map-container'), {
      locations: LOCATIONS,
      showNavigation: false
    });

    // Real-time subscription
    let unsub = firebaseService.subscribeTeam(user.teamId, (team) => {
      if (!team) return;

      sabotageEngine.init(team, user);
      sabotageEngine.handleTeamUpdate(team);
      rogueAIEngine.init(team, user);
      rogueAIEngine.handleTeamUpdate(team);

      const idx = team.currentLocationIndex || 1;

      // Redirect to finish if all done
      if (idx > LOCATIONS.length || team.finishTime) {
        window.location.href = "finish.html";
        return;
      }

      // Progress bar
      const done = idx - 1;
      document.getElementById('progress-fill').style.width = `${Math.round((done / LOCATIONS.length) * 100)}%`;
      document.getElementById('progress-text').textContent = `${done}/${LOCATIONS.length}`;

      // Map Scramble check
      const scr = team.sabotageState?.mapScramble;
      const isScrambled = scr?.active && scr?.expiresAt > Date.now();

      mapEngine.updateState({
        currentIndex: idx,
        scrambleState: isScrambled ? scr : null
      });

      // HUD
      const hud = document.getElementById('hud');
      const dot = document.getElementById('hud-dot');
      const label = document.getElementById('hud-label');
      const name = document.getElementById('hud-name');
      const clue = document.getElementById('hud-clue');

      if (isScrambled) {
        const fake = LOCATIONS.find(l => l.id === scr.fakeLocationId) || LOCATIONS[0];
        label.textContent = '⚠ RADAR ANOMALY';
        label.style.color = '#f17d0e';
        dot.style.background = '#f17d0e';
        name.textContent = 'Navigation scrambled';
        clue.textContent = 'Use the answer from your last puzzle to find the next location.';
      } else {
        label.textContent = `STATION ${idx} OF ${LOCATIONS.length}`;
        label.style.color = '';
        dot.style.background = '';
        name.textContent = 'Find the next station';
        clue.textContent = 'Solve the puzzle at the current station to reveal where to go next.';
      }
    });

    // Controls
    window.toggleDaylight = () => { displayMode.toggle(); };
    window.toggleSnd = () => {
      const m = sound.toggleMute();
      document.getElementById('btn-snd').textContent = m ? '🔇' : '🔊';
    };
    if (sound.getMuted()) document.getElementById('btn-snd').textContent = '🔇';

    window.openScanner = () => {
      sound.click();
      document.getElementById('scanner-modal').classList.remove('hidden');
    };
    window.closeScanner = () => {
      document.getElementById('scanner-modal').classList.add('hidden');
    };
    window.submitManualUrl = () => {
      const url = document.getElementById('manual-url').value.trim();
      if (url) window.location.href = url;
    };

    window.addEventListener('beforeunload', () => { if (unsub) unsub(); });
  </script>
</body>
</html>
