<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <!-- Sci-Fi Radar Grid Patterns -->
    <pattern id="campus-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-dasharray="2 2"/>
    </pattern>
    <radialGradient id="radar-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lawn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="building-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="road-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="sci-fi-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Space Campus Foundation -->
  <rect width="1200" height="900" fill="#0b1120"/>
  <rect width="1200" height="900" fill="url(#campus-grid)"/>
  <circle cx="600" cy="450" r="500" fill="url(#radar-glow)"/>

  <!-- Radar Con-Centric Range Circles -->
  <circle cx="600" cy="450" r="220" fill="none" stroke="#0369a1" stroke-width="1" stroke-dasharray="6 8" opacity="0.4"/>
  <circle cx="600" cy="450" r="420" fill="none" stroke="#0369a1" stroke-width="1" stroke-dasharray="6 8" opacity="0.3"/>

  <!-- Main Campus Perimeter Boundary -->
  <rect x="60" y="50" width="1080" height="800" rx="28" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.5"/>

  <!-- Campus Lawns & Green Spaces -->
  <!-- Central Great Lawn -->
  <path d="M 420 380 Q 600 360 760 410 L 730 650 Q 580 670 430 620 Z" fill="url(#lawn-grad)" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.8"/>
  <!-- Sports Ground / Oval -->
  <ellipse cx="940" cy="260" rx="130" ry="85" fill="#064e3b" stroke="#10b981" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="940" cy="260" rx="90" ry="50" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <text x="940" y="265" fill="#6ee7b7" font-family="'Fredoka', sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="2">CRICKET / SPORTS ARENA</text>

  <!-- Campus Spine Road Network -->
  <!-- North-South Central Spine -->
  <path d="M 390 850 L 400 680 L 410 320 L 440 80" fill="none" stroke="#475569" stroke-width="32" stroke-linecap="round"/>
  <path d="M 390 850 L 400 680 L 410 320 L 440 80" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="10 10"/>

  <!-- East-West Connectors -->
  <path d="M 80 610 L 1120 610" fill="none" stroke="#334155" stroke-width="22" stroke-linecap="round"/>
  <path d="M 80 340 L 1120 340" fill="none" stroke="#334155" stroke-width="22" stroke-linecap="round"/>
  <path d="M 740 340 L 740 680" fill="none" stroke="#334155" stroke-width="20"/>

  <!-- CAMPUS BUILDINGS -->
  <!-- A Block Complex -->
  <g id="building-a-block">
    <rect x="520" y="260" width="180" height="90" rx="8" fill="url(#building-grad)" stroke="#38bdf8" stroke-width="2"/>
    <text x="610" y="305" fill="#f8fafc" font-family="'Fredoka', sans-serif" font-size="18" font-weight="700" text-anchor="middle">BLOCK A</text>
    <text x="610" y="325" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Academic Atrium &amp; Admin</text>
    <!-- A Block Curved Amphitheater Bench Zone (Station 4) -->
    <path d="M 540 375 Q 610 405 680 375" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
    <path d="M 548 385 Q 610 415 672 385" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="610" cy="380" r="6" fill="#f59e0b" filter="url(#sci-fi-glow)"/>
    <text x="610" y="425" fill="#fbbf24" font-family="'Fredoka', sans-serif" font-size="13" font-weight="700" text-anchor="middle">STATION 4: A Block Seating</text>
  </g>

  <!-- B Block -->
  <g id="building-b-block">
    <rect x="740" y="260" width="130" height="75" rx="6" fill="url(#building-grad)" stroke="#475569" stroke-width="1.5"/>
    <text x="805" y="305" fill="#cbd5e1" font-family="'Fredoka', sans-serif" font-size="15" font-weight="600" text-anchor="middle">BLOCK B</text>
  </g>

  <!-- C Block & Gazebo (Station 3) -->
  <g id="building-c-block">
    <rect x="780" y="420" width="170" height="95" rx="8" fill="url(#building-grad)" stroke="#38bdf8" stroke-width="2"/>
    <text x="865" y="468" fill="#f8fafc" font-family="'Fredoka', sans-serif" font-size="17" font-weight="700" text-anchor="middle">BLOCK C</text>
    <text x="865" y="488" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Science &amp; Petroleum Wing</text>
    <!-- C Block Gazebo Pavilion -->
    <polygon points="888,495 918,510 918,540 888,555 858,540 858,510" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="888" cy="525" r="4" fill="#ffffff"/>
    <text x="888" y="575" fill="#38bdf8" font-family="'Fredoka', sans-serif" font-size="13" font-weight="700" text-anchor="middle">STATION 3: C Block Gazebo</text>
  </g>

  <!-- D Block & Gazebo (Station 2) -->
  <g id="building-d-block">
    <rect x="560" y="510" width="170" height="95" rx="8" fill="url(#building-grad)" stroke="#38bdf8" stroke-width="2"/>
    <text x="645" y="558" fill="#f8fafc" font-family="'Fredoka', sans-serif" font-size="17" font-weight="700" text-anchor="middle">BLOCK D</text>
    <text x="645" y="578" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Engineering Labs</text>
    <!-- D Block Gazebo Pavilion -->
    <polygon points="636,600 666,615 666,645 636,660 606,645 606,615" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="636" cy="630" r="4" fill="#ffffff"/>
    <text x="636" y="682" fill="#38bdf8" font-family="'Fredoka', sans-serif" font-size="13" font-weight="700" text-anchor="middle">STATION 2: D Block Gazebo</text>
  </g>

  <!-- E & F Block Laboratories -->
  <g id="building-ef-block">
    <rect x="780" y="550" width="160" height="90" rx="8" fill="url(#building-grad)" stroke="#475569" stroke-width="1.5"/>
    <text x="860" y="602" fill="#cbd5e1" font-family="'Fredoka', sans-serif" font-size="16" font-weight="600" text-anchor="middle">BLOCK E &amp; F</text>
  </g>

  <!-- Student Activity Centre (OSAIL) & Gazebo (Station 1) -->
  <g id="osail-complex">
    <rect x="230" y="570" width="150" height="95" rx="8" fill="url(#building-grad)" stroke="#38bdf8" stroke-width="2"/>
    <text x="305" y="615" fill="#f8fafc" font-family="'Fredoka', sans-serif" font-size="16" font-weight="700" text-anchor="middle">OSAIL SAC</text>
    <text x="305" y="635" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Student Activity Centre</text>
    <!-- Octagonal OSAIL Gazebo Pavilion -->
    <polygon points="318,655 348,670 348,700 318,715 288,700 288,670" fill="#a855f7" stroke="#c084fc" stroke-width="2.5" filter="url(#sci-fi-glow)"/>
    <circle cx="318" cy="685" r="5" fill="#ffffff"/>
    <text x="318" y="738" fill="#c084fc" font-family="'Fredoka', sans-serif" font-size="13" font-weight="700" text-anchor="middle">STATION 1: OSAIL Gazebo</text>
  </g>

  <!-- Hostels & Ness 1 Float (Station 5) -->
  <g id="ness-hostels">
    <rect x="180" y="190" width="120" height="150" rx="10" fill="url(#building-grad)" stroke="#38bdf8" stroke-width="2"/>
    <text x="240" y="260" fill="#f8fafc" font-family="'Fredoka', sans-serif" font-size="17" font-weight="700" text-anchor="middle">NESS HOSTEL</text>
    <text x="240" y="280" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Residential Towers</text>
    <!-- Ness 1 Float Canopy Structure -->
    <ellipse cx="264" cy="325" rx="35" ry="25" fill="#0284c7" stroke="#38bdf8" stroke-width="2.5" opacity="0.8"/>
    <path d="M 235 330 L 264 305 L 293 330 Z" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="264" cy="325" r="4" fill="#ffffff" filter="url(#sci-fi-glow)"/>
    <text x="264" y="375" fill="#38bdf8" font-family="'Fredoka', sans-serif" font-size="13" font-weight="700" text-anchor="middle">STATION 5: Ness 1 Float</text>
  </g>

  <!-- Gemini Amphitheatre Stage (Station 6 - Finale Hub) -->
  <g id="gemini-stage-area">
    <!-- Amphitheatre Steps Arc -->
    <path d="M 520 180 Q 624 130 728 180" fill="none" stroke="#ef4444" stroke-width="18" stroke-linecap="round" opacity="0.7"/>
    <path d="M 540 195 Q 624 150 708 195" fill="none" stroke="#ef4444" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
    <!-- Stage Deck -->
    <rect x="580" y="125" width="88" height="45" rx="5" fill="#ef4444" stroke="#ffffff" stroke-width="2" filter="url(#sci-fi-glow)"/>
    <polygon points="624,110 644,125 604,125" fill="#facc15"/>
    <text x="624" y="152" fill="#ffffff" font-family="'Fredoka', sans-serif" font-size="14" font-weight="800" text-anchor="middle">GEMINI STAGE</text>
    <text x="624" y="98" fill="#f87171" font-family="'Fredoka', sans-serif" font-size="13" font-weight="700" text-anchor="middle">STATION 6: FINAL OBJECTIVE</text>
  </g>

  <!-- Cafeteria & Food Court -->
  <g id="cafeteria">
    <rect x="230" y="440" width="130" height="70" rx="8" fill="url(#building-grad)" stroke="#475569" stroke-width="1.5"/>
    <text x="295" y="480" fill="#cbd5e1" font-family="'Fredoka', sans-serif" font-size="14" font-weight="600" text-anchor="middle">CAMPUS CAFETERIA</text>
  </g>

  <!-- Atmospheric Map Details -->
  <!-- Compass Rose -->
  <g transform="translate(1080, 110)">
    <circle cx="0" cy="0" r="32" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="0,-26 6,0 -6,0" fill="#ef4444"/>
    <polygon points="0,26 6,0 -6,0" fill="#94a3b8"/>
    <text x="0" y="-10" fill="#ef4444" font-family="'Fredoka', sans-serif" font-size="11" font-weight="700" text-anchor="middle">N</text>
  </g>

  <!-- Map Title Card -->
  <g transform="translate(90, 80)">
    <rect x="0" y="0" width="280" height="54" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" opacity="0.95"/>
    <text x="14" y="24" fill="#38bdf8" font-family="'Fredoka', sans-serif" font-size="15" font-weight="700" letter-spacing="1">PDEU CAMPUS RADAR</text>
    <text x="14" y="42" fill="#94a3b8" font-family="sans-serif" font-size="11">Pandit Deendayal Energy University</text>
  </g>
</svg>
